<html lang="ja">
<head>

  <title>VBA Sprint - 学習プロトタイプ</title>
  <style>
    :root{--ink:#17231f;--muted:#68756f;--paper:#f4f2eb;--card:#fffdf7;--green:#175c47;--lime:#dced7b;--line:#d9ddd4;--red:#bc4b45;--shadow:0 14px 40px rgba(24,48,39,.1)}
    *{box-sizing:border-box} body{margin:0;color:var(--ink);background:var(--paper);font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",system-ui,sans-serif;min-height:100vh}
    button{font:inherit} .app{max-width:1100px;margin:auto;padding:22px 24px 64px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;gap:11px;align-items:center;font-weight:900;letter-spacing:-.03em}.logo{width:38px;height:38px;border-radius:12px;background:var(--green);color:white;display:grid;place-items:center}.logo b{color:var(--lime)}.streak{font-size:13px;background:#fff;padding:8px 12px;border:1px solid var(--line);border-radius:999px}
    .screen{display:none}.screen.active{display:block}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:36px;align-items:end;margin:32px 0 34px}.eyebrow{font-size:12px;font-weight:800;color:var(--green);letter-spacing:.12em}.hero h1{font-size:clamp(36px,6vw,69px);line-height:.98;letter-spacing:-.06em;margin:10px 0 18px}.hero p{color:var(--muted);line-height:1.8;max-width:570px}.progress-card{background:var(--green);color:white;border-radius:24px;padding:24px;box-shadow:var(--shadow)}.progress-card small{opacity:.72}.big{font-size:42px;font-weight:900;margin:8px 0}.track{height:8px;background:#ffffff2a;border-radius:8px;overflow:hidden}.track i{display:block;width:0;height:100%;background:var(--lime);transition:.4s}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.mode{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:20px;text-align:left;cursor:pointer;min-height:152px;transition:.18s}.mode:hover{transform:translateY(-3px);border-color:var(--green);box-shadow:var(--shadow)}.mode.primary{background:var(--lime);border-color:transparent}.icon{font-size:23px}.mode h3{margin:24px 0 5px;font-size:17px}.mode p{color:var(--muted);font-size:12px;margin:0}.section-title{margin:34px 0 15px;font-size:14px}.categories{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 13px;cursor:pointer}.chip:hover,.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
    .study-shell{max-width:740px;margin:20px auto}.study-head{display:flex;align-items:center;gap:15px}.close{border:0;background:none;font-size:25px;cursor:pointer}.question-count{font-size:13px;font-weight:800;margin-left:auto}.study-progress{height:7px;flex:1;background:#dfe2da;border-radius:9px;overflow:hidden}.study-progress i{display:block;height:100%;background:var(--green);transition:.3s}.question-card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:clamp(22px,5vw,42px);margin-top:25px;box-shadow:var(--shadow)}.meta{display:flex;gap:8px;margin-bottom:28px}.tag{font-size:11px;font-weight:800;padding:5px 9px;background:#e8eee9;border-radius:7px}.tag.level{background:#fff0ca}.question-card h2{font-size:clamp(22px,4vw,31px);line-height:1.5;letter-spacing:-.03em;margin:0 0 25px}.code{background:#17231f;color:#dff2e8;border-radius:14px;padding:17px;white-space:pre-wrap;font:14px/1.7 Consolas,monospace;margin-bottom:22px}.choices{display:grid;gap:10px}.choice{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border:1px solid var(--line);background:white;border-radius:13px;cursor:pointer}.choice:hover:not(:disabled){border-color:var(--green);background:#f3f8f3}.choice b{display:grid;place-items:center;width:27px;height:27px;background:#edf0ea;border-radius:8px}.choice.correct{border-color:var(--green);background:#e5f3ec}.choice.wrong{border-color:var(--red);background:#fae9e7}.feedback{display:none;margin-top:24px;border-top:1px solid var(--line);padding-top:20px}.feedback.show{display:block}.verdict{font-weight:900;font-size:20px}.verdict.good{color:var(--green)}.verdict.bad{color:var(--red)}.explain{line-height:1.8;color:#4f5d57}.actions{display:flex;gap:10px;margin-top:20px}.btn{border:0;border-radius:12px;padding:13px 19px;font-weight:800;cursor:pointer}.btn.main{background:var(--green);color:white;margin-left:auto}.btn.sub{background:#e7eae4}.btn.flagged{background:#ffe6a3}
    .result{text-align:center;max-width:670px;margin:45px auto}.result .ring{width:155px;height:155px;margin:25px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0deg,#dde1da 0);position:relative}.ring:after{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--paper)}.ring strong{font-size:38px;z-index:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:white;border:1px solid var(--line);padding:16px;border-radius:15px}.stat strong{display:block;font-size:24px}.result .btn{margin-top:25px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#17231f;color:white;padding:11px 17px;border-radius:10px;font-size:13px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    .dashboard{display:grid;grid-template-columns:1.1fr .9fr;gap:15px;margin-top:28px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}.panel h3{margin:0 0 15px;font-size:15px}.bars{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:90px 1fr 38px;align-items:center;gap:8px;font-size:12px}.mini-track{height:7px;border-radius:7px;background:#e2e5df;overflow:hidden}.mini-track i{display:block;height:100%;background:var(--green)}.calendar{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}.day{aspect-ratio:1;border-radius:4px;background:#e6e8e2}.day.on{background:#85b99f}.day.hot{background:var(--green)}.settings{display:grid;gap:10px}.setting{display:flex;justify-content:space-between;align-items:center;font-size:13px}.setting input{width:110px;border:1px solid var(--line);border-radius:8px;padding:7px}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{font-size:11px;background:#edf0ea;color:#88918d;padding:7px 10px;border-radius:999px}.badge.earned{background:#fff0b8;color:#67510a}.feedback-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.tiny{font-size:12px;border:1px solid var(--line);background:white;border-radius:8px;padding:7px 10px;cursor:pointer}.self-rate{display:flex;gap:7px;margin-top:14px}.self-rate button{flex:1}.details{margin-top:14px;background:#eef3ef;border-radius:12px;padding:13px}.details summary{cursor:pointer;font-weight:800;font-size:13px}.details p{font-size:13px;line-height:1.7;margin-bottom:0}.mission{display:flex;justify-content:space-between;align-items:center;background:#e6f0a7;border-radius:13px;padding:13px 15px;margin-bottom:14px;font-size:13px}.spark{animation:pop .45s ease}@keyframes pop{50%{transform:scale(1.07)}}
    @media(max-width:700px){.app{padding:17px 16px 45px}.hero{grid-template-columns:1fr;gap:14px;margin-top:18px}.hero h1{font-size:46px}.progress-card{padding:18px}.big{font-size:32px}.grid{grid-template-columns:1fr 1fr}.mode{min-height:132px;padding:16px}.mode h3{margin-top:16px}.question-card{margin-top:17px}.actions{flex-wrap:wrap}.btn.main{width:100%;order:3}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.dashboard{grid-template-columns:1fr}.bar-row{grid-template-columns:80px 1fr 35px}.self-rate{flex-direction:column}}
    .calendar-panel{grid-column:1/-1}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.calendar-head h3{margin:0}.calendar-nav{display:flex;align-items:center;gap:8px}.calendar-nav button{border:1px solid var(--line);background:white;border-radius:8px;width:31px;height:31px;cursor:pointer}.month-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday{text-align:center;color:var(--muted);font-size:11px;font-weight:800;padding:4px}.month-day{min-height:72px;border-radius:10px;background:#f0f1ec;border:1px solid transparent;padding:8px;text-align:left;cursor:pointer;color:var(--ink)}.month-day:hover{border-color:var(--green)}.month-day.blank{visibility:hidden}.month-day.today{outline:2px solid var(--green)}.month-day .date{display:block;font-size:11px}.month-day .count{display:block;margin-top:9px;font-size:15px;font-weight:900;color:var(--green)}.month-day .count.zero{color:#aeb5b0;font-weight:500}.top-next{min-width:112px;min-height:48px;white-space:nowrap;background:var(--green);color:white;border:0;border-radius:13px;padding:12px 20px;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 5px 14px rgba(23,92,71,.2)}.top-next:disabled{background:#cdd2ce;color:#7d8782;cursor:not-allowed;box-shadow:none}@media(max-width:700px){.month-day{min-height:55px;padding:5px}.month-day .count{font-size:12px;margin-top:5px}.study-head{gap:8px;flex-wrap:wrap}.study-head .study-progress{order:3;flex-basis:100%;height:8px}.study-head .question-count{margin-left:auto}.top-next{min-width:120px;min-height:52px;padding:13px 18px;font-size:15px;border-radius:14px}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand"><span class="logo">V<b>+</b></span><span>VBA SPRINT</span></div><span class="streak">🔥 <b id="streak">0</b>日連続</span></header>
  <section id="home" class="screen active">
    <div class="hero"><div><div class="eyebrow">EXCEL VBA STANDARD</div><h1>短く解いて、<br>しっかり定着。</h1><p>一問ずつテンポよく。正解だけでなく「まだ不安」も記録して、自分専用の復習セットを作れます。</p></div><div class="progress-card"><small>累計学習</small><div class="big"><span id="totalAnswered">0</span> 問</div><div class="track"><i id="totalBar"></i></div><small><span id="mastered">0</span> / 12問に挑戦済み</small></div></div>
    <div class="mission"><span>今日の目標 <b id="todayCount">0</b> / <b id="dailyGoalLabel">10</b>問</span><span id="missionMark">あと10問</span></div>
    <div class="grid">
      <button class="mode primary" onclick="startQuiz('due')"><span class="icon">▶</span><h3>今日の復習</h3><p id="dueCaption">復習予定から出題</p></button>
      <button class="mode" onclick="startQuiz('weak')"><span class="icon">⚑</span><h3>苦手を復習</h3><p id="weakCaption">登録された問題はありません</p></button>
      <button class="mode" onclick="startQuiz('mistakes')"><span class="icon">↻</span><h3>間違い直し</h3><p id="mistakeCaption">前回までのミスを集中対策</p></button>
    </div>
    <h2 class="section-title">分野から選ぶ</h2><div class="categories" id="categories"></div>
    <div class="dashboard"><section class="panel"><h3>分野別成績</h3><div class="bars" id="categoryBars"></div></section><section class="panel"><h3>獲得バッジ</h3><div class="badges" id="badges"></div></section><section class="panel"><h3>学習設定</h3><div class="settings"><label class="setting">1日の目標<input id="goalInput" type="number" min="1" max="100" onchange="saveSettings()"></label><label class="setting">試験日<input id="examInput" type="date" onchange="saveSettings()"></label><div class="setting"><span>試験まで</span><b id="countdown">未設定</b></div><button class="tiny" onclick="validateData()">問題データを検査</button></div></section><section class="panel calendar-panel"><div class="calendar-head"><h3>学習カレンダー</h3><div class="calendar-nav"><button onclick="moveCalendar(-1)" aria-label="前月">‹</button><b id="calendarTitle"></b><button onclick="moveCalendar(1)" aria-label="翌月">›</button></div></div><div class="month-calendar" id="calendar"></div><p style="color:var(--muted);font-size:11px;margin:12px 0 0">日付をタップすると、その日の回答数を編集できます。</p></section></div>
  </section>
  <section id="study" class="screen"><div class="study-shell"><div class="study-head"><button class="close" onclick="goHome()" aria-label="終了">×</button><div class="study-progress"><i id="quizBar"></i></div><span class="question-count" id="qCount"></span><button class="top-next" id="topNext" onclick="nextQuestion()" disabled>次へ →</button></div><article class="question-card"><div class="meta"><span class="tag" id="qCategory"></span><span class="tag level" id="qLevel"></span></div><h2 id="qText"></h2><div class="code" id="qCode"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"><div class="verdict" id="verdict"></div><p class="explain" id="explanation"></p><details class="details"><summary>詳しいポイント・類似構文</summary><p id="detailText"></p></details><div class="feedback-tools"><button class="tiny" onclick="copyCode()">コードをコピー</button><button class="tiny" id="bookmarkBtn" onclick="toggleBookmark()">☆ 保存</button><button class="tiny" onclick="reportQuestion()">問題を報告</button><button class="tiny" onclick="openRelated()">関連問題</button></div><div class="self-rate"><button class="tiny" onclick="rate('mastered')">理解した</button><button class="tiny" onclick="rate('lucky')">勘で正解</button><button class="tiny" onclick="rate('unsure')">まだ不安</button></div><div class="actions"><button class="btn sub" id="flagBtn" onclick="toggleWeak()">⚑ まだ不安</button><button class="btn main" onclick="nextQuestion()">次の問題 →</button></div></div></article></div></section>
  <section id="result" class="screen"><div class="result"><div class="eyebrow">SESSION COMPLETE</div><h1>おつかれさまでした</h1><div class="ring" id="ring"><strong id="scorePct"></strong></div><div class="stats"><div class="stat"><strong id="correctStat"></strong>正解</div><div class="stat"><strong id="wrongStat"></strong>不正解</div><div class="stat"><strong id="weakStat"></strong>苦手登録</div></div><button class="btn main" onclick="goHome()">ホームへ戻る</button></div></section>
</main><div class="toast" id="toast"></div>
<script>
const questions=[
 {id:1,c:'変数・定数',l:'基礎',q:'変数を明示的に宣言するステートメントはどれですか？',a:['Dim','Sub','Call','Set'],ok:0,e:'Dim ステートメントで変数を宣言します。Option Explicit を使うと宣言漏れも検出できます。'},
 {id:2,c:'変数・定数',l:'標準',q:'Integer型の変数 n に文字列「10」を代入するとどうなりますか？',code:'Dim n As Integer\nn = "10"',a:['10が代入される','型が違うため必ずエラー','文字列のまま代入される','0が代入される'],ok:0,e:'変換可能な文字列は暗黙に数値へ変換されます。ただし、意図を明確にするなら CInt などを使います。'},
 {id:3,c:'セル操作',l:'基礎',q:'セル A1 に「完了」と入力するコードはどれですか？',a:['Range("A1").Value = "完了"','Range("A1") == "完了"','Cell("A1") = "完了"','A1.Value("完了")'],ok:0,e:'Range オブジェクトの Value プロパティに値を代入します。'},
 {id:4,c:'セル操作',l:'標準',q:'次のコードで選択される範囲はどれですか？',code:'Range("A1").CurrentRegion.Select',a:['A1を含む連続した表範囲','A列全体','使用済みセルすべて','A1だけ'],ok:0,e:'CurrentRegion は空白行・空白列で囲まれた連続範囲を返します。表全体の取得に便利です。'},
 {id:5,c:'条件分岐',l:'基礎',q:'score が80以上のときだけ処理する条件として正しいものは？',a:['If score >= 80 Then','If score => 80','If score Over 80','When score >= 80'],ok:0,e:'比較演算子は >= の順序で書き、条件の後ろに Then を置きます。'},
 {id:6,c:'繰り返し',l:'標準',q:'次のループで Debug.Print は何回実行されますか？',code:'For i = 1 To 5 Step 2\n    Debug.Print i\nNext i',a:['3回','2回','4回','5回'],ok:0,e:'i は 1、3、5 と2ずつ増えるため、処理は3回実行されます。'},
 {id:7,c:'プロシージャ',l:'基礎',q:'戻り値を返せるプロシージャはどれですか？',a:['Function','Sub','Property Letだけ','Module'],ok:0,e:'Function プロシージャは自身の名前に値を代入して戻り値を返せます。'},
 {id:8,c:'ブック・シート',l:'標準',q:'現在アクティブなブックを表すオブジェクトは？',a:['ActiveWorkbook','ThisWorkbook','CurrentBook','SelectedWorkbook'],ok:0,e:'ActiveWorkbook は現在操作対象のブックです。ThisWorkbook はコードが保存されているブックを表します。'},
 {id:9,c:'エラー処理',l:'標準',q:'実行時エラーが発生したら ErrorHandler ラベルへ移動する記述は？',a:['On Error GoTo ErrorHandler','Try ErrorHandler','On Error Resume ErrorHandler','Catch ErrorHandler'],ok:0,e:'On Error GoTo ラベル名 で、エラー発生時の処理位置を指定します。'},
 {id:10,c:'配列',l:'標準',q:'動的配列 arr の要素数を後から変更するステートメントは？',a:['ReDim','Resize','ReArray','Dim Again'],ok:0,e:'ReDim で動的配列の大きさを変更します。既存値を保つ場合は Preserve を併用します。'},
 {id:11,c:'イベント',l:'標準',q:'ワークシート上のセルが変更されたときに発生するイベントは？',a:['Worksheet_Change','Worksheet_Click','Workbook_Change','Cell_Changed'],ok:0,e:'Worksheet_Change イベントは、ユーザー操作や外部リンクによってセルが変更されたときに発生します。'},
 {id:12,c:'デバッグ',l:'基礎',q:'イミディエイトウィンドウへ値を表示する命令は？',a:['Debug.Print','Console.Write','Msg.Print','Immediate.Show'],ok:0,e:'Debug.Print を使うと、変数や式の値をイミディエイトウィンドウで確認できます。'}
];
const KEY='vbaSprintPrototype';
const defaults={answered:0,seen:[],weak:[],mistakes:[],bookmarks:[],lastDate:'',streak:0,history:{},records:{},dailyGoal:10,examDate:'',lastSession:null};
let state=Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'));state.history=state.history||{};state.records=state.records||{};state.bookmarks=state.bookmarks||[];
let quiz=[],pos=0,score=0,answered=false,sessionRatings={},calendarCursor=new Date();
const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('sv-SE'); const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));scrollTo(0,0)}
function init(){const cats=[...new Set(questions.map(x=>x.c))];$('categories').innerHTML=cats.map(c=>`<button class="chip" onclick="startQuiz('category','${c}')">${c}</button>`).join('');$('goalInput').value=state.dailyGoal;$('examInput').value=state.examDate;updateHome()}
function updateHome(){
 $('totalAnswered').textContent=state.answered;$('mastered').textContent=state.seen.length;$('totalBar').style.width=(state.seen.length/questions.length*100)+'%';$('streak').textContent=state.streak;$('weakCaption').textContent=state.weak.length?`${state.weak.length}問を登録中`:'登録された問題はありません';$('mistakeCaption').textContent=state.mistakes.length?`${state.mistakes.length}問をもう一度`:'前回までのミスを集中対策';
 const n=state.history[today()]||0,left=Math.max(0,state.dailyGoal-n);$('todayCount').textContent=n;$('dailyGoalLabel').textContent=state.dailyGoal;$('missionMark').textContent=left?`あと${left}問`:'達成！';const due=questions.filter(q=>!state.records[q.id]||!state.records[q.id].due||state.records[q.id].due<=today()).length;$('dueCaption').textContent=`復習予定 ${due}問`;
 renderBars();renderCalendar();renderBadges();renderCountdown();
}
function startQuiz(mode,cat){let pool=questions;if(mode==='weak')pool=questions.filter(q=>state.weak.includes(q.id));if(mode==='mistakes')pool=questions.filter(q=>state.mistakes.includes(q.id));if(mode==='category')pool=questions.filter(q=>q.c===cat);if(mode==='due'){pool=questions.filter(q=>!state.records[q.id]||!state.records[q.id].due||state.records[q.id].due<=today());if(!pool.length){toast('今日の復習は完了です');return}}if(!pool.length){toast(mode==='weak'?'「まだ不安」で問題を登録してください':'対象の問題はありません');return}quiz=[...pool].sort(()=>Math.random()-.5).slice(0,10);pos=0;score=0;sessionRatings={};show('study');render()}
function render(){answered=false;const q=quiz[pos],options=q.a.map((text,original)=>({text,original})).sort(()=>Math.random()-.5);$('topNext').disabled=true;$('topNext').textContent=pos===quiz.length-1?'結果へ →':'次へ →';$('qCount').textContent=`${pos+1} / ${quiz.length}`;$('quizBar').style.width=(pos/quiz.length*100)+'%';$('qCategory').textContent=q.c;$('qLevel').textContent=q.l;$('qText').textContent=q.q;$('qCode').textContent=q.code||'';$('qCode').style.display=q.code?'block':'none';$('feedback').classList.remove('show');$('choices').innerHTML=options.map((option,display)=>`<button class="choice" data-answer="${option.original}" onclick="answer(${option.original});$('topNext').disabled=false"><b>${String.fromCharCode(65+display)}</b><span>${option.text}</span></button>`).join('');$('detailText').textContent=detailFor(q);updateFlag();updateBookmark()}
function answer(i){if(answered)return;answered=true;const q=quiz[pos],good=i===q.ok;document.querySelectorAll('.choice').forEach(b=>{const original=Number(b.dataset.answer);b.disabled=true;if(original===q.ok)b.classList.add('correct');else if(original===i)b.classList.add('wrong')});$('verdict').textContent=good?'正解！':'おしい！';$('verdict').className='verdict '+(good?'good':'bad');$('explanation').textContent=q.e;$('feedback').classList.add('show');state.answered++;if(!state.seen.includes(q.id))state.seen.push(q.id);if(good){score++;state.mistakes=state.mistakes.filter(x=>x!==q.id)}else if(!state.mistakes.includes(q.id))state.mistakes.push(q.id);const rec=state.records[q.id]||{tries:0,correct:0};rec.tries++;if(good)rec.correct++;rec.last=today();rec.due=addDays(good?3:0);state.records[q.id]=rec;touchDay();save();if(good&&score>1){$('verdict').classList.add('spark');toast(`${score}問正解！いい調子です`)}}
function touchDay(){const t=today();state.history[t]=(state.history[t]||0)+1;if(state.lastDate===t)return;const y=new Date();y.setDate(y.getDate()-1);state.streak=state.lastDate===y.toLocaleDateString('sv-SE')?state.streak+1:1;state.lastDate=t}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')}
function rate(kind){const q=quiz[pos],rec=state.records[q.id]||{};sessionRatings[q.id]=kind;rec.rating=kind;rec.due=addDays(kind==='mastered'?7:kind==='lucky'?1:0);state.records[q.id]=rec;if(kind==='unsure'&&!state.weak.includes(q.id))state.weak.push(q.id);save();updateFlag();toast(kind==='mastered'?'7日後に復習します':kind==='lucky'?'明日もう一度出題します':'今日もう一度復習します')}
function toggleWeak(){const id=quiz[pos].id;state.weak=state.weak.includes(id)?state.weak.filter(x=>x!==id):[...state.weak,id];save();updateFlag();toast(state.weak.includes(id)?'苦手問題に登録しました':'苦手登録を解除しました')}
function updateFlag(){const on=state.weak.includes(quiz[pos].id);$('flagBtn').classList.toggle('flagged',on);$('flagBtn').textContent=on?'★ 苦手登録済み':'⚑ まだ不安'}
function toggleBookmark(){const id=quiz[pos].id;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];save();updateBookmark();toast(state.bookmarks.includes(id)?'ブックマークしました':'ブックマークを解除しました')}
function updateBookmark(){const on=state.bookmarks.includes(quiz[pos].id);$('bookmarkBtn').textContent=on?'★ 保存済み':'☆ 保存'}
function copyCode(){const q=quiz[pos],text=q.code||q.q+'\n正解: '+q.a[q.ok];navigator.clipboard?navigator.clipboard.writeText(text).then(()=>toast('コピーしました')).catch(()=>fallbackCopy(text)):fallbackCopy(text)}
function fallbackCopy(text){const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('コピーしました')}
function reportQuestion(){const q=quiz[pos],text=`問題ID: ${q.id}\n問題: ${q.q}\n報告内容: `;fallbackCopy(text);toast('報告テンプレートをコピーしました')}
function openRelated(){const c=quiz[pos].c,related=questions.filter(q=>q.c===c&&q.id!==quiz[pos].id);if(!related.length){toast('関連問題はありません');return}quiz.splice(pos+1,0,related[Math.floor(Math.random()*related.length)]);toast('次に関連問題を追加しました')}
function detailFor(q){const map={'変数・定数':'Variant は柔軟ですが、明示的なデータ型指定の方が意図が明確で安全です。','セル操作':'Range はセル番地、Cells は行番号・列番号による指定に向いています。','ブック・シート':'ActiveWorkbook と ThisWorkbook は一致しない場合があります。','エラー処理':'Resume Next はエラーを無視するため、使用範囲を限定します。'};return map[q.c]||`「${q.a[q.ok]}」がこの問題の要点です。同じ分野の関連問題でも確認しましょう。`}
function renderBars(){const cats=[...new Set(questions.map(q=>q.c))];$('categoryBars').innerHTML=cats.map(c=>{const ids=questions.filter(q=>q.c===c).map(q=>q.id),rs=ids.map(id=>state.records[id]).filter(Boolean),tries=rs.reduce((s,r)=>s+(r.tries||0),0),ok=rs.reduce((s,r)=>s+(r.correct||0),0),p=tries?Math.round(ok/tries*100):0;return `<div class="bar-row"><span>${c}</span><div class="mini-track"><i style="width:${p}%"></i></div><b>${p}%</b></div>`}).join('')}
function renderCalendar(){const y=calendarCursor.getFullYear(),m=calendarCursor.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),names=['日','月','火','水','木','金','土'];$('calendarTitle').textContent=`${y}年 ${m+1}月`;let h=names.map(n=>`<span class="weekday">${n}</span>`).join('');for(let i=0;i<first;i++)h+='<span class="month-day blank"></span>';for(let d=1;d<=last;d++){const dt=new Date(y,m,d),k=dt.toLocaleDateString('sv-SE'),n=state.history[k]||0;h+=`<button class="month-day ${k===today()?'today':''}" onclick="editDay('${k}')"><span class="date">${d}</span><span class="count ${n?'':'zero'}">${n}問</span></button>`}$('calendar').innerHTML=h}
function moveCalendar(n){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+n,1);renderCalendar()}
function editDay(date){const current=state.history[date]||0,value=prompt(`${date} の回答数を入力してください`,current);if(value===null)return;const n=Number(value);if(!Number.isInteger(n)||n<0||n>999){toast('0～999の整数を入力してください');return}if(n===0)delete state.history[date];else state.history[date]=n;save();updateHome();toast(`${date} を ${n}問に更新しました`)}
function renderBadges(){const cats=[...new Set(questions.map(q=>q.c))],earned=cats.filter(c=>questions.filter(q=>q.c===c).every(q=>(state.records[q.id]?.correct||0)>0));const items=[['はじめの一歩',state.answered>0],['10問達成',state.answered>=10],['3日連続',state.streak>=3],...cats.map(c=>[c+'マスター',earned.includes(c)])];$('badges').innerHTML=items.map(x=>`<span class="badge ${x[1]?'earned':''}">${x[1]?'🏅':'○'} ${x[0]}</span>`).join('')}
function saveSettings(){state.dailyGoal=Math.max(1,+$('goalInput').value||10);state.examDate=$('examInput').value;save();updateHome()}
function renderCountdown(){if(!state.examDate){$('countdown').textContent='未設定';return}const n=Math.ceil((new Date(state.examDate+'T00:00:00')-new Date())/86400000);$('countdown').textContent=n>=0?`あと${n}日`:'試験日経過'}
function validateData(){const ids=questions.map(q=>q.id),errors=[];if(new Set(ids).size!==ids.length)errors.push('ID重複');questions.forEach(q=>{if(!q.q||!q.e||!q.a?.length)errors.push(`ID ${q.id}: 必須項目不足`);if(q.ok<0||q.ok>=q.a.length)errors.push(`ID ${q.id}: 正解番号不正`);if(new Set(q.a).size!==q.a.length)errors.push(`ID ${q.id}: 選択肢重複`)});toast(errors.length?`${errors.length}件の問題を検出`:`${questions.length}問すべて正常です`)}
function nextQuestion(){if(pos<quiz.length-1){pos++;render()}else finish()}
function finish(){show('result');const pct=Math.round(score/quiz.length*100),prev=state.lastSession;$('scorePct').textContent=pct+'%';$('ring').style.background=`conic-gradient(var(--green) ${pct*3.6}deg,#dde1da 0)`;$('correctStat').textContent=score;$('wrongStat').textContent=quiz.length-score;$('weakStat').textContent=state.weak.length;state.lastSession={pct,date:today()};save();if(prev)setTimeout(()=>toast(`前回比 ${pct-prev.pct>=0?'+':''}${pct-prev.pct}ポイント`),350)}
function goHome(){show('home');updateHome()} function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)} init();
</script>

if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
